.lang{padding:22px 10px;font-size:20px;text-align:center;background:var(--lg);color:var(--dg);border:3px solid var(--m);margin:0}.lang.on{border-color:var(--g);background:#fff;box-shadow:0 0 0 3px var(--g)}
.steps{display:flex;gap:6px;margin:8px 0}.steps i{flex:1;height:10px;border-radius:6px;background:var(--m)}.steps i.on{background:var(--g)}
.stat{background:var(--lg);border-radius:14px;padding:10px;text-align:center}.stat b{font-size:22px;color:var(--dg);display:block}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:20px;margin-right:6px}.tm{background:#d6ecff;color:#0b4a8a}.ts{background:#fff0c9;color:#7a5200}.tc{background:#e6dcff;color:#4b2a99}
.warn{background:#fff4e5;border-left:5px solid var(--y);padding:10px;border-radius:8px;margin:8px 0}.err{background:#fdecea;border-left:5px solid var(--r);padding:10px;border-radius:8px}

.seq{font-size:20px;margin:6px 0}.seq span{white-space:nowrap}.hi{color:var(--g);font-weight:700}.lo{color:var(--r);font-weight:700}
#splash{position:fixed;inset:0;background:linear-gradient(#e6f4ea,#bbe3c4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:9}
.plant{font-size:80px;animation:gr 2s ease-out}@keyframes gr{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.bar{width:200px;height:8px;background:#fff;border-radius:6px;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:0;background:var(--g);animation:ld 2.2s forwards}@keyframes ld{to{width:100%}}

 let h=`${steps(3)}<h1>${t('p3')}</h1><div class="card"><h2>📋 A</h2><div class="two"><div>📍 ${F.village||''} ${F.district}, ${F.state}, ${F.country}<br>${S.loc?S.loc.lat+', '+S.loc.lon:''}<br>📐 ${F.size} ${F.unit}<br>🌱 ${nm(F.cur)||'Not decided (suggestions below)'}<br>↩️ ${nm(F.prev)||'—'}<br>🪱 ${F.soil}; pH ${F.idk||!F.ph?'—':F.ph}; N-P-K ${F.idk?'—':[F.N,F.P,F.K].map(x=>x||'?').join('-')}</div>

 h+=st.map((x,i)=>`<div class="card"><h2>${x.n}</h2><div class="seq">${x.seq.map(cn).map(c=>`<span>${c}</span>`).join(' → ')}</div>${x.seq.length?'':'<div class="warn">Not enough input to build this sequence.</div>'}<small>${[...new Set(x.seq)].map(c=>`${cn(c)}: ${C[c][8].join('/')}, water ${LV[C[c][4]]}, N need ${LV[C[c][9]]}`).join('<br>')}</small><br><button class="${S.plan===i?'':'o'}" onclick="S.plan=${i};render()">${S.plan===i?'✅ ':''}${t('pick')}</button><span class="tag tc">Model-generated suggestion</span></div>`).join('');
 h+=`<div class="card"><h2>⚖️ C</h2><div class="sw"><table><tr><th></th>${st.map(x=>`<th>${x.n}</th>`).join('')}</tr>${Object.keys(rt[0]).map(k=>`<tr><td>${k}</td>${rt.map(r=>`<td>${col(r[k])}</td>`).join('')}</tr>`).join('')}</table></div><small>Qualitative ratings from general crop traits and your inputs. Legume benefits depend on variety, inoculation and management.</small></div>`;
 const nw=[...new Set([...st[1].nw,...st[2].nw])];
 h+=`<div class="card"><h2>❓ D</h2>${nw.length?nw.map(c=>{const x=C[c],m=[];m.push(`${x[8].join('/')} crop${F.next?(x[8].includes(F.next)?', matches your planting season ('+F.next+')':''):''}; water need ${LV[x[4]]}`);if(w)m.push(`NASA: ${f1(w.rain)} mm rain, ${f1(w.tavg)}°C avg, soil wetness ${f1(w.sm)} over ${w.n} days`);m.push(`Soil: ${F.soil}${F.idk?' (no lab data)':''}`);const pr=[];if(F.pri.includes('Improve soil health')&&x[5])pr.push('soil health');if(F.pri.includes('Conserve water')&&x[4]==0)pr.push('water conservation');if(F.pri.includes('Reduce soil erosion')&&x[7]==2)pr.push('erosion cover');if(F.pri.includes('Increase crop diversity')&&x[3]!=(C[F.cur[0]]||[])[3])pr.push('crop diversity');return `<p><b>${cn(c)}</b><br>• ${m.join('<br>• ')}<br>• Fits your priorities: ${pr.join(', ')||'not directly'}<br>• ${x[5]?'May add nitrogen to soil through its roots (depends on management)':'Adds crop diversity'}${x[4]==0?'; low water demand may help when water is limited':''}</p>`}).join(''):'No new crops could be suggested with the inputs given.'}</div>`;
 h+=`<div class="two"><div class="card"><h2>✅ Potential benefits</h2><ul><li>Better soil health and nutrient cycling</li><li>More crop diversity and fewer repeated pests</li><li>${w&&w.dry?'Lower-water crops may help with the dry signal':'Possible water conservation'}</li><li>Reduced erosion with ground cover</li><li>Greater climate resilience</li><li>Possible additional income</li></ul></div><div class="card"><h2>⚠️ Possible risks</h2><ul><li>Pest and disease concerns with new crops</li><li>Market uncertainty (no price data)</li><li>Seasonal mismatch if planting dates shift</li><li>Water shortages${w&&w.dry?' (dry signal seen)':''}</li><li>Soil incompatibility${F.idk?' (soil not tested)':''}</li><li>Missing information (below)</li></ul></div></div>`;
 h+=`<div class="card"><h2>🕳️ F</h2><ul>${gaps.map(g=>`<li>${g}</li>`).join('')}</ul></div>`;
 const pl=S.plan!=null?st[S.plan]:null;
 if(!F.cur.length)h=h.replace('<div class="card"><h2>📋 A</h2>','<div class="card"><h2>🌱 What can I plant?</h2>You did not choose a current crop, so these are starting suggestions based on your soil, water, season and NASA data. Strategy 2 (soil health) and Strategy 3 (water &amp; climate) show the crops to explore first.</div><div class="card"><h2>📋 A</h2>');
 h+=`<div class="card"><h2>🧭 G</h2>${pl?`<ol><li>Explore: <b>${pl.n.slice(3)}</b> – ${nm(pl.seq)}</li><li>Planting season: ${F.next||'confirm locally'}</li><li>Soil preparation: get a soil test (pH, N, P, K) before sowing${F.soil=='Clay soil'?'; clay soil needs good drainage':''}</li><li>Water: plan irrigation for ${F.irr||'your'} supply${w&&w.dry?'; recent dryness noted':''}; do not rely on exact water-saving claims</li><li>Verify crop varieties, seed, prices and pests with your local agriculture office or KVK</li></ol>`:'Select a preferred plan above to see your action plan.'}</div>
 <div class="card"><button onclick="speak()">🔊 ${t('read')}</button><button onclick="window.print()">📄 ${t('pdf')}</button><button onclick="savePlan()">💾 ${t('save')}</button><button class="o" onclick="S.pg=3;render()">${t('back')}</button><p><small>${T.en.disc}</small></p></div>`;return h}
function speak(){const st=strategies(),tx=[t('p3'),...st.map(x=>x.n+': '+x.seq.map(c=>S.lang=='ta'?C[c][2]:C[c][1]).join(', ')),T.en.disc].join('. ');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(tx);u.lang=SP[S.lang];speechSynthesis.speak(u)}
function savePlan(){try{localStorage.setItem('agrismart_plan',JSON.stringify({f:S.f,loc:S.loc,plan:S.plan,at:new Date().toISOString()}));alert('✅ Saved')}catch(e){alert('Could not save')}}
setTimeout(()=>{$('#splash').remove();S.pg=1;render()},2400);
</script></body></html>
